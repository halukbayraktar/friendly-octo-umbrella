name: Yayın adreslerini güncelle

on:
  schedule:
    - cron: "0 4 * * 1"   # her Pazartesi 04:00 UTC (07:00 Türkiye)
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canlı yayın ID'lerini bul
        run: python scripts/update_channels.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --cached --quiet || git commit -m "Yayın adresleri güncellendi ($(date -u +%Y-%m-%d))"
          git push
